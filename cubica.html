<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cubica tu Obra: estima materiales de tu proyecto con Rucalhue Arquitectura. Cubicación aproximada, sujeta a revisión profesional.">
<meta name="theme-color" content="#2E4539">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="canonical" href="https://rucalhuearquitectura.cl/cubica.html">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cubica tu Obra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: banda de marca, pasos numerados de obra, formulario a la izquierda y cantidades vivas a la derecha */
:root{--bg:#F4F1EA;--sf:#ffffff;--fg:#1f2a24;--mut:#59645c;--line:#d6d2c6;--acc:#2E4539;--on:#F4F1EA;--wood:#8a6243;--inp:#fffaf0;--ok:#2d6a4f;--bad:#a4332b;--warn:#8a5a00;
--disp:"Newsreader",Georgia,serif;--body:"Work Sans","Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151c18;--sf:#1e2822;--fg:#ece9e1;--mut:#a6b0a8;--line:#36433b;--acc:#2E4539;--on:#F4F1EA;--wood:#d0a585;--inp:#27332c;--ok:#74c69d;--bad:#ef9a92;--warn:#e6b65c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151c18;--sf:#1e2822;--fg:#ece9e1;--mut:#a6b0a8;--line:#36433b;--acc:#2E4539;--on:#F4F1EA;--wood:#d0a585;--inp:#27332c;--ok:#74c69d;--bad:#ef9a92;--warn:#e6b65c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--acc);color:var(--on)}
header .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;padding-block:16px}
h1{font:400 1.75rem/1.15 var(--disp);margin:0}.brand{display:flex;align-items:center;gap:14px}.brand img{height:38px;width:auto}
.aviso{background:#B68B6A;color:#1f2e26;font-size:.84rem;font-weight:500}.aviso .wrap{padding-block:6px}
header p{margin:0;font-size:.82rem;opacity:.86}
.chip{display:inline-flex;gap:8px;align-items:center;background:rgba(244,241,234,.14);padding:6px 12px;border-radius:6px;font-size:.85rem}
.chip b{font-weight:600}
nav{background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav .wrap{overflow-x:auto}.gn{display:flex;gap:2px}
.sub{background:var(--bg);border-bottom:1px solid var(--line)}.sub .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:8px}
.sub button{font:inherit;font-size:.86rem;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:5px 14px;color:var(--mut);cursor:pointer;white-space:nowrap}.sub button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}.dk{font:inherit;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:6px;cursor:pointer;color:var(--fg)}.dk span{font-size:.8rem;color:var(--mut)}.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;display:block}.bar i{display:block;height:100%;background:var(--wood)}
.docs{display:grid;gap:8px}.dc{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.dc span{display:block;color:var(--mut);font-size:.82rem}.dc .btn{padding:6px 14px}
.gf{margin:0 0 18px;background:var(--sf);border:1px solid var(--line);border-radius:6px;padding:12px;color:var(--fg)}.gs{display:block;width:100%;height:auto}.leg{display:flex;flex-wrap:wrap;gap:16px}.leg div{display:grid;justify-items:center;gap:4px;font-size:.78rem;color:var(--mut)}
.sk{color:var(--fg);display:block}.skw{width:66px;display:flex;align-items:center;justify-content:center}
.vf{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;flex:1;min-width:0}
.supv{padding:7px 0;color:var(--fg)}
.art.rc{grid-template-columns:minmax(0,2fr) 70px 80px 80px 34px;margin-bottom:6px}.mapv{display:block;width:100%;height:auto;margin-top:12px;cursor:crosshair;border:1px solid var(--line)}.art{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 70px 34px;gap:6px;align-items:center}.art.dst{grid-template-columns:minmax(0,1.4fr) 84px minmax(0,1.5fr) 34px;margin-bottom:6px}.art.hd{font-size:.8rem;color:var(--mut)}.art .x{height:34px}
nav button{font:inherit;font-size:.9rem;background:none;border:0;color:var(--mut);padding:12px 10px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button[aria-current="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--wood)}
main{padding-block:24px 56px;min-width:0}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
aside{position:sticky;top:64px;margin-top:24px;background:var(--sf);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:10px;max-height:calc(100vh - 84px);overflow:auto;font-size:.85rem}
nav button.g.man{background:#B68B6A;color:#1f2a24;border-radius:5px;font-weight:600;margin-left:auto}.art.xd{grid-template-columns:minmax(0,1fr) 34px;margin-bottom:6px}.esq{display:block;width:100%;height:auto;margin:8px 0;border-radius:4px}.esb{max-width:420px}.mant td:first-child{font-weight:600;white-space:nowrap}.mani{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.mani div{display:flex;gap:10px;align-items:center}.mani img{width:52px;height:52px;flex:none}.mani b{display:block}.mani span{font-size:.82rem;color:var(--mut)}.aviso[hidden]{display:none}label.wide{grid-column:1/-1}.art.rc input[data-f=n]{min-width:0}@media (max-width:560px){.art.rc{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 34px}.art.rc input[data-f=n]{grid-column:1/-1}.art.rc.hd{display:none}.art.rc select,.art.rc input{min-width:0}}@media (max-width:980px){.lay{grid-template-columns:minmax(0,1fr)}aside{position:static;max-height:none;margin-top:0;margin-bottom:32px}}
.err{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.errs{list-style:none;margin:0;padding:0;display:grid;gap:6px}.lk{font:inherit;background:none;border:0;padding:0;color:var(--bad);text-align:left;cursor:pointer;text-decoration:underline}
.fal{display:flex;flex-wrap:wrap;gap:4px 10px}.fal .lk{color:var(--warn)}.okk{margin:0;color:var(--ok)}.mini td{padding:4px 2px}
.bd{display:inline-block;margin-left:5px;min-width:18px;padding:0 4px;border-radius:9px;background:var(--bad);color:var(--sf);font-size:.72rem;text-align:center}
h2{font:400 1.6rem/1.2 var(--disp);margin:0 0 4px}
h3{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;font-weight:600}
.lead{color:var(--mut);margin:0 0 20px;max-width:65ch}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--sf);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:18px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
label{display:grid;gap:3px;font-size:.84rem;color:var(--mut);min-width:0}
input[type=file]{background:transparent;border:1px dashed var(--line);padding:10px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--inp);border:1px solid var(--line);border-radius:4px;padding:7px 8px;width:100%;box-sizing:border-box;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--wood);outline-offset:1px}
textarea{min-height:92px;resize:vertical;line-height:1.45}
.mat{display:grid;grid-template-columns:minmax(130px,1.5fr) repeat(7,minmax(54px,1fr));gap:5px;align-items:center;font-size:.8rem;min-width:600px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--mut);font-size:.78rem}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
td b{font-weight:600}
.st{font-weight:600;white-space:nowrap}.st.CUMPLE{color:var(--ok)}.st.NO{color:var(--bad)}.st.REV{color:var(--warn)}.st.USE{color:var(--mut);font-weight:400}
.btn{font:inherit;font-weight:500;padding:9px 14px;border-radius:5px;border:1px solid var(--acc);background:var(--acc);color:var(--on);cursor:pointer}
.btn.sec{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.55;cursor:wait}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:.84rem;color:var(--mut);margin:0;max-width:75ch}
.msg{font-size:.88rem;min-height:1.4em;margin:0}
.vano{display:flex;gap:10px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line)}.vano input,.vano select{padding:6px 5px;font-size:.84rem}
.vano .x{height:34px;width:34px;flex:none;background:none;border:1px solid var(--line);border-radius:4px;color:var(--mut);cursor:pointer;font:inherit}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.volver{color:var(--on);font-size:.85rem}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:8px}.chk label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;color:var(--fg)}.chk input{width:18px;height:18px;flex:none;margin-top:2px}
[hidden]{display:none!important}
.sug,.help{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.9rem}
.sug li.a{color:var(--bad)}.sug li.a b,.sug li.t b{font-weight:600}
.dl td{padding-block:8px}.dl .btn{padding:6px 14px}
details{border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;font-weight:500}
@media (prefers-reduced-motion:no-preference){nav button{transition:color .15s}}
</style>
